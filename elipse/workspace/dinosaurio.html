<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Dino Game</title>
<style>
  body, html {margin:0; padding:0; height:100%; overflow:hidden;}
  #game {position:relative; background:#f7f7f7; width:100%; height:100%; overflow:hidden;}
  .dino {
    position:absolute; bottom:0; left:50px;
    width:50px; height:50px;
    background:#000; border-radius:5px;
    transition:bottom 0.2s;
  }
  .obstacle {
    position:absolute; bottom:0; right:0;
    width:30px; height:60px;
    background:#333; animation:fall 1.5s linear infinite;
  }
  @keyframes fall {
    0%   {right:0;}
    100% {right:100vw;}
  }
  .jump {bottom:120px;}
</style>
</head>
<body>
<div id="game">
  <div class="dino" id="dino"></div>
  <div class="obstacle" id="obs"></div>
</div>

<script>
const dino = document.getElementById('dino');
const obs  = document.getElementById('obs');

// Salto con la tecla Espacio
document.addEventListener('keydown', e=>{
  if(e.code==='Space' && !dino.classList.contains('jump')){
    dino.classList.add('jump');
    setTimeout(()=>dino.classList.remove('jump'),200);
  }
});

// Colisión simple
function detectCollision(){
  const dinoRect = dino.getBoundingClientRect();
  const obsRect  = obs.getBoundingClientRect();
  const hit = !(
    dinoRect.right < obsRect.left ||
    dinoRect.left  > obsRect.right ||
    dinoRect.bottom < obsRect.top
  );
  return hit;
}

setInterval(()=>{
  if(detectCollision()){
    alert('¡Game Over!');
    // Reiniciar
    location.reload();
  }
}, 10);
</script>
</body>
</html>
