<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>El Mapache que no quiere dormir</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background-color: #ffeb3b;
      text-align: center;
      margin: 0;
      padding: 0;
      color: #333;
      padding-top: 50px;
    }
    h1 {
      font-size: 3em;
      color: #8b4513;
      text-shadow: 3px 3px 5px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }
    .mapache {
      width: 300px;
      height: 300px;
      margin: 0 auto;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/8/8c/Coati_%28nasu%29.jpg');
      background-size: cover;
      background-position: center;
      border: 10px solid #ff6b6b;
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: waddle 2s infinite alternate;
      transition: transform 0.3s ease;
    }
    .mapache:hover {
      transform: scale(1.1);
    }
    p {
      font-size: 1.5em;
      margin: 20px auto;
      line-height: 1.6;
      color: #444;
      font-style: italic;
    }
    @keyframes waddle {
      0% { transform: rotate(5deg) scale(1); }
      50% { transform: rotate(-3deg) scale(1.05); }
      100% { transform: rotate(5deg) scale(1.08); }
    }
    .meme {
      font-size: 1.2em;
      color: #d4a015;
      font-weight: bold;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <h1>¡Hola, soy el Mapache!</h1>
  <div class="mapache"></div>
  <p>¿Sabías que el mapache no quiere dormir? ¡Solo quiere jugar con los otros animales! 🐾</p>
  <p>El mapache es un animal curioso, listo para saltar, robar frutas y hacer chistes.</p>
  <p class="meme">"¡No me pises el ojo, que soy mapache!"</p>
</body>
</html>
